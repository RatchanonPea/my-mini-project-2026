<section class="settings-page">
  <div class="page-header">
    <div>
      <h3>ตั้งค่าและข้อมูลหลัก</h3>
      <p class="subtitle">จัดการข้อมูลสินค้า, ข้อมูลพนักงาน, และค่าบริการพื้นฐาน</p>
    </div>
  </div>

  <div class="settings-grid">
    @for (card of cards; track card.title) {
      @if (card.link) {
        <a class="settings-link" [routerLink]="card.link">
          <ng-container *ngTemplateOutlet="cardTpl; context: { $implicit: card }" />
        </a>
      } @else {
        <div class="settings-link disabled" aria-disabled="true">
          <ng-container *ngTemplateOutlet="cardTpl; context: { $implicit: card }" />
        </div>
      }
    }
  </div>
</section>

<ng-template #cardTpl let-card>
  <mat-card class="settings-card">
    <mat-card-header>
      <div class="card-icon"><mat-icon>{{ card.icon }}</mat-icon></div>
      <mat-card-title>{{ card.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ card.description }}</p>
      <span class="card-action">
        {{ card.action }}
        @if (card.link) { <mat-icon>arrow_forward</mat-icon> }
      </span>
    </mat-card-content>
  </mat-card>
</ng-template>
